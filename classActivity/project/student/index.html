<!DOCTYPE html>
<html>

<head>
    <title>Student Performance Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>📊 Student Performance Dashboard</h1>

    <table>
        <tr>
            <th>Subject</th>
            <th>Marks (Out of 100)</th>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td><input type="number" class="marks"></td>
        </tr>

        <tr>
            <td>Physics</td>
            <td><input type="number" class="marks"></td>
        </tr>

        <tr>
            <td>Computer Science</td>
            <td><input type="number" class="marks"></td>
        </tr>

        <tr>
            <td>English</td>
            <td><input type="number" class="marks"></td>
        </tr>

    </table>

    <button id="analyzeBtn">Analyze Performance</button>

    <div id="result">Enter marks to see performance.</div>
    <script src="script.js"></script>
</body>

</html>
